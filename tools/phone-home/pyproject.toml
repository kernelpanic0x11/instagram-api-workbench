[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonehome"
version = "0.1.0"
description = "Observe and replay a phone's network traffic"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "requests>=2.31", "jinja2>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
phonehome = "phonehome.cli:main"

[tool.setuptools.packages.find]
include = ["phonehome*"]

[tool.setuptools.package-data]
phonehome = ["data/*.json", "data/*LICENSE"]
